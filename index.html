<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GitHub Daily Commit Tracker</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-gray-100 min-h-screen flex flex-col items-center p-6">

  <div class="max-w-3xl w-full bg-gray-800 rounded-xl shadow-lg p-6 border border-gray-700">
    <h1 class="text-2xl font-bold mb-4 text-center text-green-400">GitHub Daily Commit Tracker</h1>

    <!-- Configuration Controls -->
    <div class="flex flex-col sm:flex-row gap-3 mb-6">
      <input id="username" type="text" placeholder="GitHub Username" class="bg-gray-700 border border-gray-600 rounded px-3 py-2 text-white flex-1 focus:outline-none focus:border-green-500" value="octocat">
      <input id="repo" type="text" placeholder="Repository Name" class="bg-gray-700 border border-gray-600 rounded px-3 py-2 text-white flex-1 focus:outline-none focus:border-green-500" value="Hello-World">
      <button onclick="fetchCommits()" class="bg-green-600 hover:bg-green-500 text-white font-semibold px-5 py-2 rounded transition">Track</button>
    </div>

    <!-- Status & Overview -->
    <div id="status" class="text-sm text-gray-400 mb-4 text-center">Enter details and click Track.</div>

    <div class="grid grid-cols-2 gap-4 mb-6">
      <div class="bg-gray-700/50 p-4 rounded-lg text-center border border-gray-600">
        <span class="block text-gray-400 text-sm">Today's Commits</span>
        <span id="todayCount" class="text-3xl font-bold text-green-400">0</span>
      </div>
      <div class="bg-gray-700/50 p-4 rounded-lg text-center border border-gray-600">
        <span class="block text-gray-400 text-sm">Total Tracked (Recent)</span>
        <span id="totalCount" class="text-3xl font-bold text-blue-400">0</span>
      </div>
    </div>

    <!-- Daily Breakdown Chart/List -->
    <h2 class="text-lg font-semibold mb-3 text-gray-200">Recent Daily Breakdown</h2>
    <div id="commitList" class="space-y-2 max-h-64 overflow-y-auto pr-2">
      <!-- Dynamic list entries will be injected here -->
    </div>
  </div>

  <script>
    async function fetchCommits() {
      const username = document.getElementById('username').value.trim();
      const repo = document.getElementById('repo').value.trim();
      const statusEl = document.getElementById('status');
      const commitListEl = document.getElementById('commitList');
      const todayCountEl = document.getElementById('todayCount');
      const totalCountEl = document.getElementById('totalCount');

      if (!username || !repo) {
        statusEl.textContent = 'Please enter both username and repository name.';
        return;
      }

      statusEl.textContent = 'Fetching commit data...';
      commitListEl.innerHTML = '';

      try {
        // Fetch up to 100 recent commits from the specified repository
        const response = await fetch(`https://api.github.com/repos/${username}/${repo}/commits?per_page=100`);
        
        if (!response.ok) {
          throw new Error(response.status === 404 ? 'Repository or user not found.' : 'Failed to fetch commits.');
        }

        const commits = await response.json();
        statusEl.textContent = `Successfully loaded activity for ${username}/${repo}`;

        // Group commits by date (YYYY-MM-DD)
        const dailyCommits = {};
        const todayStr = new Date().toISOString().split('T')[0];

        commits.forEach(item => {
          const commitDate = item.commit.committer.date.split('T')[0];
          dailyCommits[commitDate] = (dailyCommits[commitDate] || 0) + 1;
        });

        // Update Summary Cards
        todayCountEl.textContent = dailyCommits[todayStr] || 0;
        totalCountEl.textContent = commits.length;

        // Render Daily Activity Rows
        const sortedDates = Object.keys(dailyCommits).sort((a, b) => new Date(b) - new Date(a));

        if (sortedDates.length === 0) {
          commitListEl.innerHTML = '<div class="text-gray-500 text-center py-4">No recent commits found.</div>';
          return;
        }

        sortedDates.forEach(date => {
          const count = dailyCommits[date];
          const isToday = date === todayStr;

          const row = document.createElement('div');
          row.className = `flex justify-between items-center p-3 rounded-lg border ${
            isToday ? 'bg-green-950/40 border-green-600' : 'bg-gray-700/30 border-gray-700'
          }`;

          row.innerHTML = `
            <div class="flex items-center gap-2">
              <span class="w-3 h-3 rounded-full ${count >= 5 ? 'bg-green-400' : count >= 2 ? 'bg-green-600' : 'bg-green-800'}"></span>
              <span class="font-medium ${isToday ? 'text-green-300 font-bold' : 'text-gray-300'}">${date} ${isToday ? '(Today)' : ''}</span>
            </div>
            <span class="px-2.5 py-1 text-xs font-semibold rounded bg-gray-800 text-gray-300 border border-gray-600">
              ${count} commit${count > 1 ? 's' : ''}
            </span>
          `;
          commitListEl.appendChild(row);
        });

      } catch (error) {
        statusEl.textContent = `Error: ${error.message}`;
        todayCountEl.textContent = '0';
        totalCountEl.textContent = '0';
      }
    }

    // Auto-load default repo on page launch
    window.onload = fetchCommits;
  </script>
</body>
</html>
